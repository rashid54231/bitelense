name: bitelens_app
description: "BiteLens - AI Food & Calorie Tracker with Desi & Global Dish Recognition."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  permission_handler: ^11.3.1
  purchases_flutter: ^8.7.0
  fl_chart: ^0.70.2
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.2
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.3
  path_provider: ^2.1.5
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
